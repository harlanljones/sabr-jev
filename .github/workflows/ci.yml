name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    name: Elixir (offline suite, format, warnings)
    runs-on: ubuntu-latest
    env:
      # The suite must pass with no credential: recorded Jev fixtures only.
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Format check
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Offline test suite (no API key)
        run: mix test

  python:
    name: Python ETL + metric suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Committed-artifact and weight checks always run; SQL cross-checks against
      # the bulk Lahman inputs skip when data/lahman is absent, which it is here
      # (bulk inputs are gitignored by design). No network, no fixtures invented.
      - run: python3 -m unittest discover -s tests -v
